[project]
name = "telefold"
version = "0.1.0"
description = "LLM 驱动的 Telegram 分组自动整理工具"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.45.0,<2",
    "pydantic>=2.14.2,<3",
    "pydantic-ai-slim[openai]>=2.66.0,<3",
    "typer>=0.27.3,<1",
    "json5>=0.17.3,<1",
]

[project.scripts]
telefold = "telefold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<3",
    "pytest>=9.2.0,<10",
    "pytest-socket>=0.8.1,<0.9",
    "ruff>=0.17.3,<0.18",
]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
